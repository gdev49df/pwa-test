<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Голосовые заметки</title>

  <!-- pwa: манифест и цвет строки состояния -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111112">
  <meta name="color-scheme" content="dark">

  <!-- pwa для ios (safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Заметки">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="../theme.css">
  <style>
    .app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 170px); }
    header { padding: 0 4px 18px; }
    .title { margin: 6px 0 0; font-family: var(--display); font-size: 36px; font-weight: 800; letter-spacing: -.035em; line-height: 1.08; }
    header::before { content: "ddx notes"; display: block; font-family: var(--label); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--mute); }
    .count { margin: 6px 0 0; font-size: 14px; color: var(--mute); }
    .hint { margin: 0 0 10px; padding: 14px 16px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line);
      font-size: 15px; line-height: 1.5; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .note { position: relative; overflow: hidden; padding: 16px 16px 6px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, 0) 55%), var(--card);
      border: 1px solid var(--line); border-top-color: var(--line-top); border-radius: 18px; }
    .note::before { content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, .13) 1px, transparent 1.3px); background-size: 9px 9px;
      -webkit-mask-image: radial-gradient(120% 110% at 100% 0%, #000 0%, transparent 55%); mask-image: radial-gradient(120% 110% at 100% 0%, #000 0%, transparent 55%); }
    .note > * { position: relative; }
    .stamp { margin: 0; font-family: var(--label); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
    .text { margin: 8px 0 0; font-family: var(--body); font-size: 18px; font-weight: 400; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
    .actions { display: flex; gap: 2px; margin: 8px -8px 0; }
    .act { min-height: 44px; padding: 0 10px; background: none; border: 0; font-family: var(--label); font-size: 13px; letter-spacing: .08em; color: var(--mute); }
    .act.strong { color: var(--silver); }
    .act.danger:active { color: var(--ink); }
    .edit-area, .area { display: block; width: 100%; margin-top: 10px; padding: 14px 16px; font-family: var(--body); font-weight: 400;
      font-size: 17px; line-height: 1.45; resize: none; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; }
    .edit-area:focus, .area:focus { outline: none; border-color: rgba(255, 255, 255, .5); }
    .empty { padding: 22px 16px; background: var(--card); border: 1px solid var(--line); border-top-color: var(--line-top); border-radius: 18px; }
    .empty-title { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
    .empty-hint { margin: 10px 0 0; max-width: 34ch; font-size: 15px; line-height: 1.5; color: var(--mute); }
    .dock { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; padding: 30px 14px calc(env(safe-area-inset-bottom) + 14px);
      background: linear-gradient(to bottom, rgba(17, 17, 18, 0), var(--bg) 40%); }
    .dock-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
    .side { min-height: 46px; padding: 0 18px; background: var(--card2); border: 1px solid var(--line); border-top-color: var(--line-top);
      border-radius: 14px; font-family: var(--label); font-size: 14px; letter-spacing: .08em; color: var(--ink); }
    .side.left { justify-self: start; }
    .side.right { justify-self: end; min-width: 64px; }
    .mic { position: relative; width: 80px; height: 80px; padding: 0; border: 0; border-radius: 50%; color: #111; display: grid; place-items: center;
      background: radial-gradient(circle at 35% 28%, #fff, #c9c9cf 70%); box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .5) inset; }
    .mic svg { grid-area: 1 / 1; }
    .mic .stop { display: none; }
    .mic.rec .go { display: none; }
    .mic.rec .stop { display: block; }
    .mic::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 1px solid #fff; opacity: 0; pointer-events: none; }
    .mic.rec::before { animation: ring 2s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(.86); opacity: .8; } 100% { transform: scale(1.35); opacity: 0; } }
    .live { position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 122px); padding: 0 14px; }
    .live-inner { max-width: 560px; margin: 0 auto; padding: 16px; border-radius: 18px; background: var(--card2); border: 1px solid var(--line); border-top-color: var(--line-top); }
    .live-top { display: flex; align-items: center; gap: 8px; font-family: var(--label); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .live-text { margin: 10px 0 0; max-height: 30dvh; overflow: auto; font-family: var(--body); font-weight: 400; font-size: 18px; line-height: 1.45; overflow-wrap: anywhere; }
    .live-text .int { color: var(--mute); }
    .sheet { position: fixed; z-index: 3; inset: 0; background: rgba(0, 0, 0, .66); display: flex; align-items: flex-end; }
    .sheet-inner { width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 16px calc(env(safe-area-inset-bottom) + 16px);
      background: var(--card); border-top: 1px solid var(--line-top); border-radius: 22px 22px 0 0; }
    .sheet-title { margin: 0; font-family: var(--display); font-size: 23px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
    .sheet-hint { margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: var(--mute); }
    .sheet-actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn { flex: 1; min-height: 46px; border-radius: 14px; font-family: var(--label); font-size: 15px; letter-spacing: .08em; background: var(--card2); border: 1px solid var(--line); }
    .btn.primary { background: var(--paper); border-color: var(--paper); color: #111; }
    body.typing .dock, body.typing .live { display: none; }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="app">
    <header>
      <h1 class="title">заметки</h1>
      <p class="count" id="count"></p>
    </header>

    <p class="hint" id="hint" role="status" hidden></p>

    <ul class="list" id="list"></ul>

    <p class="foot">Создано @bauyrzhanov_12_</p>
  </div>

  <div class="live" id="live" hidden>
    <div class="live-inner" role="status">
      <div class="live-top"><span class="dot" aria-hidden="true"></span><span>идёт запись</span><span id="live-time">0:00</span></div>
      <p class="live-text" id="live-text"></p>
    </div>
  </div>

  <div class="dock">
    <div class="dock-inner">
      <button class="side left" id="type" type="button">текстом</button>

      <button class="mic" id="mic" type="button" aria-pressed="false" aria-label="начать запись">
        <svg class="go" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
        <svg class="stop" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/>
        </svg>
      </button>

      <button class="side right" id="lang" type="button"></button>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-inner">
      <h2 class="sheet-title">новая заметка</h2>
      <p class="sheet-hint">Нажми на микрофон на клавиатуре iPhone, чтобы продиктовать. Это работает и в приложении с экрана «Домой».</p>
      <textarea class="area" id="area" rows="5" aria-label="текст заметки"></textarea>
      <div class="sheet-actions">
        <button class="btn" id="cancel-typed" type="button">отмена</button>
        <button class="btn primary" id="save-typed" type="button">сохранить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
