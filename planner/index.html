<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DDX Planner</title>
  <meta name="description" content="Задачи, заметки, еда и деньги в одном месте. Говоришь, а приложение раскладывает всё по местам.">

  <!-- pwa: манифест и цвет строки состояния -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111112">
  <meta name="color-scheme" content="dark">

  <!-- pwa для ios (safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DDX">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="preload" href="fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- заставка и первый запуск -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-in"><div id="splash-logo"></div><p class="splash-name">DDX PLANNER</p><p class="splash-sub">Открываю…</p></div>
  </div>
  <div class="onb" id="onb" hidden></div>

  <div class="app">
    <header class="bar" id="bar">
      <div>
        <p class="label" id="kicker"></p>
        <h1 id="title"></h1>
      </div>
      <button class="icon-btn" id="bar-btn" type="button" hidden></button>
    </header>
    <main id="view"></main>
  </div>

  <!-- то, что распознаётся прямо сейчас -->
  <div class="live" id="live" hidden>
    <div class="card live-card" role="status">
      <p class="label"><span id="live-time">0:00</span> · идёт запись · нажми, чтобы закончить</p>
      <p class="live-text" id="live-text"></p>
      <p class="live-hint" id="live-hint"></p>
    </div>
  </div>

  <div class="alarm" id="alarm" role="alert" hidden></div>

  <!-- главная: восемь разделов и круглая кнопка голосового ввода -->
  <div class="dock" id="dock">
    <nav class="tabs" id="tabs" aria-label="разделы"></nav>
    <button class="fab" id="fab" type="button" aria-label="быстрый ввод голосом" aria-pressed="false"></button>
  </div>

  <!-- внутри раздела: назад в дайджест и плитка текущего раздела -->
  <nav class="subbar" id="subbar" aria-label="навигация"></nav>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="lib.js"></script>
  <script src="core.js"></script>
  <script src="hubs.js"></script>
  <script src="extra.js"></script>
  <script src="capture.js"></script>
  <script src="onboard.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
