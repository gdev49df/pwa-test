<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Моё приложение</title>

  <!-- pwa: манифест и цвет строки состояния -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- pwa для ios (safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Моё приложение">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #fff;
      font-family: -apple-system, system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; text-align: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left); }
  </style>
</head>
<body>
  <main>
    <h1>привет, это pwa</h1>
    <p>добавь меня на экран «домой»</p>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
