<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Голосовые заметки</title>

  <!-- pwa: манифест и цвет строки состояния -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15101f">
  <meta name="color-scheme" content="dark">

  <!-- pwa для ios (safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Заметки">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <style>
    @font-face { font-family: "Unbounded"; font-weight: 200 900; font-display: swap; src: url("../fonts/unbounded-cyrillic.woff2") format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
    @font-face { font-family: "Unbounded"; font-weight: 200 900; font-display: swap; src: url("../fonts/unbounded-latin.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
    @font-face { font-family: "Onest"; font-weight: 100 900; font-display: swap; src: url("../fonts/onest-cyrillic.woff2") format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
    @font-face { font-family: "Onest"; font-weight: 100 900; font-display: swap; src: url("../fonts/onest-latin.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
    @font-face { font-family: "Literata"; font-weight: 200 900; font-display: swap; src: url("../fonts/literata-cyrillic.woff2") format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
    @font-face { font-family: "Literata"; font-weight: 200 900; font-display: swap; src: url("../fonts/literata-latin.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }

    :root {
      --bg: #15101f;
      --surface: #221a33;
      --line: #342a4d;
      --ink: #f2eefb;
      --muted: #9b90ba;
      --rec: #ff5a6e;
      --ui: "Onest", system-ui, sans-serif;
      --display: "Unbounded", "Onest", system-ui, sans-serif;
      --read: "Literata", Georgia, serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); }
    body { min-height: 100dvh; -webkit-text-size-adjust: 100%; }

    button, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    :focus-visible { outline: 3px solid var(--rec); outline-offset: 3px; }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 150px);
    }

    /* шапка */
    .title { margin: 0; font-family: var(--display); font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; }
    .count { margin: 6px 0 0; font-size: 16px; color: var(--muted); }

    .hint {
      margin: 18px 0 0; padding: 14px 16px; border-radius: 14px;
      background: var(--surface); border: 1px solid var(--line);
      font-size: 15px; line-height: 1.5; color: var(--ink);
    }

    /* заметки: строки с линиями, текст набран шрифтом для чтения */
    .list { list-style: none; margin: 22px 0 0; padding: 0; }
    .note { padding: 22px 0 8px; border-top: 1px solid var(--line); }
    .stamp { margin: 0; font-size: 13px; color: var(--muted); }
    .text {
      margin: 8px 0 0; font-family: var(--read); font-size: 20px; line-height: 1.5;
      overflow-wrap: anywhere; white-space: pre-wrap;
    }
    .actions { display: flex; gap: 4px; margin: 6px -10px 0; }
    .act {
      min-height: 44px; padding: 0 10px; background: none; border: 0;
      font-size: 14px; font-weight: 600; color: var(--muted);
    }
    .act.strong { color: var(--rec); }
    .act.danger:active { color: var(--rec); }

    .edit-area, .area {
      display: block; width: 100%; margin-top: 10px; padding: 14px 16px;
      font-family: var(--read); font-size: 18px; /* не меньше 16px, иначе safari приближает страницу */
      line-height: 1.5; resize: none;
      background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
    }
    .edit-area:focus, .area:focus { outline: none; border-color: var(--rec); }

    /* пусто */
    .empty { padding: 28px 0; border-top: 1px solid var(--line); }
    .empty-title { margin: 0; font-family: var(--display); font-size: 19px; line-height: 1.25; font-weight: 600; }
    .empty-hint { margin: 10px 0 0; max-width: 34ch; font-size: 16px; line-height: 1.5; color: var(--muted); }

    .foot { margin: 32px 0 0; font-size: 13px; color: var(--muted); }

    /* нижняя панель */
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 28px 22px calc(env(safe-area-inset-bottom) + 14px);
      background: linear-gradient(to bottom, rgba(21, 16, 31, 0), var(--bg) 38%);
    }
    .dock-inner {
      max-width: 560px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    }
    .side {
      min-height: 48px; padding: 0 16px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 24px;
      font-size: 15px; font-weight: 600; color: var(--ink);
    }
    .side.left { justify-self: start; }
    .side.right { justify-self: end; min-width: 64px; }

    .mic {
      position: relative; width: 84px; height: 84px; padding: 0; border: 0; border-radius: 50%;
      background: var(--rec); color: #fff; display: grid; place-items: center;
    }
    .mic svg { grid-area: 1 / 1; }
    .mic .stop { display: none; }
    .mic.rec .go { display: none; }
    .mic.rec .stop { display: block; }
    .mic::before {
      content: ""; position: absolute; inset: -8px; border-radius: 50%;
      border: 2px solid var(--rec); opacity: 0; pointer-events: none;
    }
    .mic.rec::before { animation: ring 1.6s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(.86); opacity: .8; } 100% { transform: scale(1.35); opacity: 0; } }

    /* то, что распознаётся прямо сейчас */
    .live {
      position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 118px);
      padding: 0 22px;
    }
    .live-inner {
      max-width: 560px; margin: 0 auto; padding: 16px 18px; border-radius: 18px;
      background: var(--surface); border: 1px solid var(--line);
    }
    .live-top { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); }
    .live-text {
      margin: 10px 0 0; max-height: 30dvh; overflow: auto;
      font-family: var(--read); font-size: 19px; line-height: 1.5; overflow-wrap: anywhere;
    }
    .live-text .int { color: var(--muted); }

    /* ввод текстом */
    .sheet { position: fixed; inset: 0; background: rgba(10, 7, 16, .72); display: flex; align-items: flex-end; }
    .sheet-inner {
      width: 100%; max-width: 560px; margin: 0 auto;
      padding: 20px 22px calc(env(safe-area-inset-bottom) + 16px);
      background: var(--bg); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
    }
    .sheet-title { margin: 0; font-family: var(--display); font-size: 17px; font-weight: 600; }
    .sheet-hint { margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
    .sheet-actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn {
      flex: 1; min-height: 48px; border-radius: 24px; font-size: 16px; font-weight: 700;
      background: var(--surface); border: 1px solid var(--line);
    }
    .btn.primary { background: var(--rec); border-color: var(--rec); color: #fff; }

    body.typing .dock, body.typing .live { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .mic.rec::before { animation: none; opacity: .6; transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1 class="title">заметки</h1>
      <p class="count" id="count"></p>
    </header>

    <p class="hint" id="hint" role="status" hidden></p>

    <ul class="list" id="list"></ul>

    <p class="foot">Создано @bauyrzhanov_12_</p>
  </div>

  <div class="live" id="live" hidden>
    <div class="live-inner" role="status">
      <div class="live-top"><span class="dot" aria-hidden="true"></span><span>идёт запись</span><span id="live-time">0:00</span></div>
      <p class="live-text" id="live-text"></p>
    </div>
  </div>

  <div class="dock">
    <div class="dock-inner">
      <button class="side left" id="type" type="button">текстом</button>

      <button class="mic" id="mic" type="button" aria-pressed="false" aria-label="начать запись">
        <svg class="go" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
        <svg class="stop" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/>
        </svg>
      </button>

      <button class="side right" id="lang" type="button"></button>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-inner">
      <h2 class="sheet-title">новая заметка</h2>
      <p class="sheet-hint">Нажми на микрофон на клавиатуре iPhone, чтобы продиктовать. Это работает и в приложении с экрана «Домой».</p>
      <textarea class="area" id="area" rows="5" aria-label="текст заметки"></textarea>
      <div class="sheet-actions">
        <button class="btn" id="cancel-typed" type="button">отмена</button>
        <button class="btn primary" id="save-typed" type="button">сохранить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
