name = "ddx-ai"
main = "index.js"
compatibility_date = "2026-11-01"

[vars]
# сайты, которым можно обращаться к воркеру, через запятую
ALLOWED_ORIGINS = "https://gdev49df.github.io"
# модели (необязательно): список через запятую, пробуются по очереди. по умолчанию список зашит в index.js
# MODEL_ASK = "openai/gpt-oss-120b,llama-3.1-8b-instant"
# MODEL_FOOD = "qwen/qwen3.8-27b"

# ключ в файл не пишем. добавляется командой:
#   npx wrangler secret put GROQ_API_KEY

# пуши: раз в минуту проверяем напоминания
[triggers]
crons = ["* * * * *"]

# хранилище для пушей: создай namespace и подставь его id (или привяжи через сайт, переменная KV)
# [[kv_namespaces]]
# binding = "KV"
# id = "..."
