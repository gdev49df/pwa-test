<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Привычки</title>

  <!-- pwa: манифест и цвет строки состояния -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111112">

  <!-- pwa для ios (safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Привычки">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="../theme.css">
  <style>
    .app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 120px); }
    .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px 18px; }
    .date { margin: 6px 0 0; font-family: var(--display); font-size: 46px; font-weight: 600; line-height: 1.04; }
    .weekday { margin: 0; font-family: var(--label); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--mute); }
    .top > div { display: flex; flex-direction: column-reverse; }
    .edit { min-height: 44px; padding: 0 14px; background: var(--card); border: 1px solid var(--line); border-top-color: var(--line-top);
      border-radius: 14px; font-family: var(--label); font-size: 13px; letter-spacing: .08em; color: var(--silver); }
    .progress { margin: 0 4px 10px; font-size: 14px; color: var(--mute); }
    .bar { display: flex; gap: 4px; height: 4px; margin: 0 4px; }
    .seg { flex: 1; border-radius: 2px; background: rgba(255, 255, 255, .08); transition: background .6s var(--ease); }
    .seg.on { background: linear-gradient(90deg, #8f8f96, #f2f2f2); }
    .list { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
    .habit { position: relative; overflow: hidden; padding: 18px 16px 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, 0) 55%), var(--card);
      border: 1px solid var(--line); border-top-color: var(--line-top); border-radius: 18px; }
    .habit::before { content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, .13) 1px, transparent 1.3px); background-size: 9px 9px;
      -webkit-mask-image: radial-gradient(120% 110% at 100% 0%, #000 0%, transparent 60%); mask-image: radial-gradient(120% 110% at 100% 0%, #000 0%, transparent 60%); }
    .habit > * { position: relative; }
    .habit-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
    .habit-name { margin: 0; font-family: var(--display); font-size: 24px; line-height: 1.15; font-weight: 500; overflow-wrap: anywhere; }
    .streak { margin: 0; flex: none; text-align: right; line-height: 1; }
    .streak-n { display: block; font-family: var(--figure); font-size: 44px; font-weight: 600; letter-spacing: -.02em; color: var(--ink); }
    .streak-l { display: block; margin-top: 4px; font-family: var(--label); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
    .streak.zero .streak-n { color: #3a3a3e; }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 18px; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .dot { width: 100%; max-width: 46px; aspect-ratio: 1; padding: 0; border-radius: 14px; background: var(--bg2);
      border: 1px solid var(--line); display: grid; place-items: center; position: relative; transition: background .35s, border-color .35s; }
    .dot.today { border-color: rgba(255, 255, 255, .55); }
    .dot.on { background: var(--paper); border-color: var(--paper); }
    .dot.on::after { content: ""; width: 34%; height: 18%; border-left: 2.5px solid #111; border-bottom: 2.5px solid #111; transform: translateY(-12%) rotate(-45deg); }
    .dot.stamped { animation: stamp .4s var(--ease); }
    @keyframes stamp { 0% { transform: scale(.85); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
    .dl { font-family: var(--label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
    .dl.today { color: var(--ink); white-space: nowrap; }
    .del { display: none; margin-top: 14px; min-height: 40px; padding: 0 16px; background: none; border: 1px solid var(--line); border-radius: 12px;
      font-family: var(--label); font-size: 13px; letter-spacing: .08em; color: var(--silver); }
    body.editing .del { display: inline-block; }
    .empty { padding: 22px 16px; background: var(--card); border: 1px solid var(--line); border-top-color: var(--line-top); border-radius: 18px; }
    .empty-title { margin: 0; font-family: var(--display); font-size: 28px; font-weight: 500; line-height: 1.1; }
    .empty-hint { margin: 10px 0 0; max-width: 34ch; font-size: 15px; line-height: 1.5; color: var(--mute); }
    .add { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; padding: 22px 14px calc(env(safe-area-inset-bottom) + 12px);
      background: linear-gradient(to bottom, rgba(17, 17, 18, 0), var(--bg) 40%); }
    .add-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
    .input { flex: 1; min-width: 0; min-height: 48px; padding: 0 16px; font-size: 16px; font-weight: 400;
      background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; }
    .input::placeholder { color: var(--mute); }
    .input:focus { outline: none; border-color: rgba(255, 255, 255, .5); }
    .submit { min-height: 48px; padding: 0 20px; border: 0; border-radius: 14px; background: var(--paper); color: #111;
      font-family: var(--label); font-size: 15px; letter-spacing: .08em; }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="app">
    <header class="top">
      <div>
        <h1 class="date" id="date"></h1>
        <p class="weekday" id="weekday"></p>
      </div>
      <button class="edit" id="edit" type="button" hidden>изменить</button>
    </header>

    <p class="progress" id="progress"></p>
    <div class="bar" id="bar" aria-hidden="true"></div>

    <ul class="list" id="list"></ul>

    <p class="foot">Создано @bauyrzhanov_12_</p>
  </div>

  <form class="add" id="form" autocomplete="off">
    <div class="add-inner">
      <input class="input" id="input" type="text" maxlength="60" placeholder="новая привычка" enterkeyhint="done" aria-label="название новой привычки">
      <button class="submit" type="submit">добавить</button>
    </div>
  </form>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
